name: Élise mobile Android builds

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mobile-android-build.yml'
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  # Required to attach the signed builds to a private pre-release.
  contents: write

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts package
        run: pnpm --filter @michel/contracts build

      - id: android-version
        name: Set Android build version
        run: |
          version_name="$(node -e '
          const fs = require("node:fs");
          const current = JSON.parse(fs.readFileSync("apps/mobile/app.json", "utf8")).expo.version;
          const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(current);
          if (!match) throw new Error(`Invalid mobile app version: ${current}`);
          console.log(`${match[1]}.${match[2]}.${Number(match[3]) + 1}`);
          ')"
          version_code="$GITHUB_RUN_NUMBER"
          if [[ ! "$version_code" =~ ^[1-9][0-9]*$ || "$version_code" -gt 2100000000 ]]; then
            echo "::error::Invalid Android versionCode: $version_code"
            exit 1
          fi
          echo "ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Android artifact version: $version_name (versionCode $version_code)"

      - name: Generate Android project
        run: pnpm --filter @michel/mobile exec expo prebuild --platform android --no-install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Restore upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_UPLOAD_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Missing repository secret ANDROID_UPLOAD_KEYSTORE_BASE64"
            exit 1
          fi

          key_file="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          test -s "$key_file"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$key_file" >> "$GITHUB_ENV"

      - name: Attach release signing configuration
        run: cat apps/mobile/android-ci-signing.gradle >> apps/mobile/android/app/build.gradle

      - name: Build signed APK and AAB
        working-directory: apps/mobile/android
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -s "$ANDROID_UPLOAD_KEYSTORE_PATH"
          if [[ -z "${ANDROID_UPLOAD_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::Missing repository secret ANDROID_UPLOAD_KEYSTORE_PASSWORD"
            exit 1
          fi
          if [[ -z "${ANDROID_UPLOAD_KEY_ALIAS:-}" ]]; then
            echo "::error::Missing repository secret ANDROID_UPLOAD_KEY_ALIAS"
            exit 1
          fi
          if [[ -z "${ANDROID_UPLOAD_KEY_PASSWORD:-}" ]]; then
            echo "::error::Missing repository secret ANDROID_UPLOAD_KEY_PASSWORD"
            exit 1
          fi
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      # Google Play publishing must not depend on the Actions artifact storage quota.
      - name: Upload signed Android builds
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: elise-mobile-android-${{ steps.android-version.outputs.version_name }}-${{ steps.android-version.outputs.version_code }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      # Release assets do not count against the Actions artifact quota. Pre-releases are
      # ignored by the release versioning and by the appliance update agent.
      - name: Attach signed builds to a GitHub pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.android-version.outputs.version_name }}
          VERSION_CODE: ${{ steps.android-version.outputs.version_code }}
        run: |
          tag="android-v${VERSION_NAME}-${VERSION_CODE}"
          outputs="apps/mobile/android/app/build/outputs"
          release_dir="$RUNNER_TEMP/android-release"
          mkdir -p "$release_dir"
          cp "$outputs/apk/release/app-release.apk" "$release_dir/elise-companion-${VERSION_NAME}-${VERSION_CODE}.apk"
          cp "$outputs/bundle/release/app-release.aab" "$release_dir/elise-companion-${VERSION_NAME}-${VERSION_CODE}.aab"
          gh release create "$tag" "$release_dir"/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Élise Companion Android ${VERSION_NAME} (${VERSION_CODE})" \
            --notes "Signed Android builds from ${GITHUB_SHA}. The APK is for direct installation; upload the AAB to Google Play." \
            --prerelease \
            --latest=false

      - id: play-publishing
        name: Check Google Play publishing configuration
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Google Play upload skipped: only main is published."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo "::notice::Google Play upload skipped: repository secret PLAY_SERVICE_ACCOUNT_JSON is not set."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # A Play app that has never been reviewed only accepts draft releases; set the
      # repository variable PLAY_RELEASE_STATUS to "completed" once the app is live.
      - name: Upload AAB to Google Play internal testing
        if: steps.play-publishing.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.michel.mobile
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.android-version.outputs.version_name }} (${{ steps.android-version.outputs.version_code }})
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

      - name: Remove temporary upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
