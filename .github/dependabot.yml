version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      michel-javascript:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /apps/ai
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
