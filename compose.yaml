name: michel-os

x-node-common: &node-common
  restart: unless-stopped
  volumes:
    - michel_secrets:/run/michel-secrets:ro
  environment:
    MICHEL_VERSION: ${MICHEL_VERSION:-0.1.3}
    MICHEL_SECRETS_DIR: /run/michel-secrets
    POSTGRES_HOST: postgres
    POSTGRES_DB: michel
    POSTGRES_USER: michel
    MQTT_URL: mqtt://mosquitto:1883
    MQTT_USERNAME: michel_core
    AI_BASE_URL: http://ai:8000
    COOKIE_SECURE: 'false'
    TZ: ${TZ:-Europe/Paris}

services:
  screen-bootstrap:
    image: alpine:3.22
    restart: 'no'
    volumes:
      - resident_media:/media
    command:
      [
        'sh',
        '-ec',
        'mkdir -p /media/screen /media/residents && chown -R 10001:10001 /media && chmod 0750 /media /media/screen /media/residents',
      ]
  bootstrap:
    image: alpine:3.22
    restart: 'no'
    volumes:
      - michel_secrets:/secrets
      - go2rtc_config:/go2rtc
      - ./docker/go2rtc/go2rtc.yaml:/go2rtc-template.yaml:ro
    environment:
      MICHEL_WEBRTC_CANDIDATE: ${MICHEL_WEBRTC_CANDIDATE:-}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        for name in postgres_password mqtt_password ai_shared_secret session_secret camera_encryption_key camera_ticket_key; do
          if [ ! -s "/secrets/$$name" ]; then
            tr -dc 'A-Za-z0-9' </dev/urandom | head -c 48 > "/secrets/$$name"
          fi
        done
        chmod 0444 /secrets/*
        cp /go2rtc-template.yaml /go2rtc/go2rtc.yaml
        if [ -n "$${MICHEL_WEBRTC_CANDIDATE:-}" ]; then
          case "$${MICHEL_WEBRTC_CANDIDATE}" in
            *[!A-Za-z0-9._:-]*) echo 'Invalid MICHEL_WEBRTC_CANDIDATE' >&2; exit 1 ;;
          esac
          sed -i "s|candidates: \[\]|candidates: ['$${MICHEL_WEBRTC_CANDIDATE}:8555']|" /go2rtc/go2rtc.yaml
        fi

  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: michel
      POSTGRES_USER: michel
      POSTGRES_PASSWORD_FILE: /run/michel-secrets/postgres_password
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - postgres_data:/var/lib/postgresql
      - michel_secrets:/run/michel-secrets:ro
      - ./docker/postgres/init-homeassistant.sql:/docker-entrypoint-initdb.d/10-homeassistant.sql:ro
    ports:
      - '127.0.0.1:${MICHEL_POSTGRES_HOST_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U michel -d michel']
      interval: 5s
      timeout: 5s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/acl:/mosquitto/config/acl:ro
      - ./docker/mosquitto/entrypoint.sh:/usr/local/bin/michel-mosquitto-entrypoint:ro
      - mosquitto_data:/mosquitto/data
      - michel_secrets:/run/michel-secrets:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/michel-mosquitto-entrypoint']
    ports:
      - '127.0.0.1:${MICHEL_MQTT_HOST_PORT:-1884}:1883'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "mosquitto_sub -u michel_core -P $$(cat /run/michel-secrets/mqtt_password) -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.13.0
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/ttyACM0
      MICHEL_ZIGBEE_ADAPTER_TYPE: ${ZIGBEE_ADAPTER_TYPE:-auto}
    volumes:
      - zigbee2mqtt_data:/app/data
      - ./docker/zigbee2mqtt/configuration.yaml:/usr/local/share/michel/zigbee2mqtt-configuration.yaml:ro
      - ./docker/zigbee2mqtt/entrypoint.sh:/usr/local/bin/michel-zigbee-entrypoint:ro
      - michel_secrets:/run/michel-secrets:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/michel-zigbee-entrypoint']
    devices:
      - ${ZIGBEE_ADAPTER:-/dev/null}:/dev/ttyACM0

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.7.4
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Paris}
      MQTT_HOST: 127.0.0.1
      MQTT_PORT: ${MICHEL_MQTT_HOST_PORT:-1884}
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: ${MICHEL_POSTGRES_HOST_PORT:-5433}
      HA_HTTP_PORT: ${MICHEL_HA_HTTP_PORT:-8124}
      MICHEL_HOME_ID: ${MICHEL_HOME_ID:-home_demo}
      MICHEL_SECRETS_DIR: /run/michel-secrets
    volumes:
      - homeassistant_data:/config
      - ./docker/homeassistant/configuration.yaml:/config/configuration.yaml:ro
      - ./docker/homeassistant/custom_components:/config/custom_components:ro
      - ./docker/homeassistant/entrypoint.sh:/usr/local/bin/michel-ha-entrypoint:ro
      - michel_secrets:/run/michel-secrets:ro
    entrypoint: ['/bin/bash', '/usr/local/bin/michel-ha-entrypoint']

  go2rtc:
    image: ghcr.io/alexxit/go2rtc:1.9.14
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - go2rtc_config:/config:ro
    ports:
      - '${MICHEL_WEBRTC_BIND:-0.0.0.0}:8555:8555/tcp'
      - '${MICHEL_WEBRTC_BIND:-0.0.0.0}:8555:8555/udp'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:1984/api']
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    image: michel-os/ai:${MICHEL_VERSION:-0.1.3}
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      AI_SHARED_SECRET_FILE: /run/michel-secrets/ai_shared_secret
      MODEL_ROOT: /var/lib/michel-ai
    volumes:
      - ai_models:/var/lib/michel-ai
      - michel_secrets:/run/michel-secrets:ro
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    <<: *node-common
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      target: api
    image: michel-os/api:${MICHEL_VERSION:-0.1.3}
    depends_on:
      screen-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      ai:
        condition: service_healthy
      go2rtc:
        condition: service_healthy
    environment:
      MICHEL_VERSION: ${MICHEL_VERSION:-0.1.3}
      MICHEL_SECRETS_DIR: /run/michel-secrets
      POSTGRES_HOST: postgres
      POSTGRES_DB: michel
      POSTGRES_USER: michel
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: michel_core
      AI_BASE_URL: http://ai:8000
      COOKIE_SECURE: 'false'
      MICHEL_DEMO_MODE: ${MICHEL_DEMO_MODE:-false}
      MICHEL_SIMULATION_MODE: ${MICHEL_SIMULATION_MODE:-false}
      TOPOLOGY_TRACKING_ENABLED: ${TOPOLOGY_TRACKING_ENABLED:-true}
      MICHEL_HOME_ID: ${MICHEL_HOME_ID:-home_demo}
      MICHEL_DISCOVERY_NAME: ${MICHEL_DISCOVERY_NAME:-Élise OS}
      MICHEL_LOCAL_URL: ${MICHEL_LOCAL_URL:-http://elise.local}
      MICHEL_REMOTE_URL: ${MICHEL_REMOTE_URL:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-}
      ELISE_SCREEN_AGENT_SOCKET: /run/elise-screen/agent.sock
      ELISE_SCREEN_LOCAL_URL: http://127.0.0.1:${MICHEL_HTTP_PORT:-8080}
      ELISE_REMOTE_AGENT_SOCKET: /run/elise-remote-access/agent.sock
      ELISE_UPDATE_AGENT_SOCKET: /run/elise-update/agent.sock
      ELISE_JITSI_URL: ${ELISE_JITSI_URL:-}
      ELISE_JITSI_SECRET: ${ELISE_JITSI_SECRET:-}
      MEDIA_ROOT: /var/lib/elise/media
      CAMERA_MEDIA_ROOT: /var/lib/elise/camera-media
      GO2RTC_URL: http://go2rtc:1984
      MATTER_SERVER_ENABLED: ${MATTER_SERVER_ENABLED:-false}
      ZWAVE_SERVER_ENABLED: ${ZWAVE_SERVER_ENABLED:-false}
      BLUETOOTH_ENABLED: ${BLUETOOTH_ENABLED:-true}
      ESPHOME_ONBOARDING_ENABLED: ${ESPHOME_ONBOARDING_ENABLED:-false}
      HA_CONFIG_FLOW_ENABLED: ${HA_CONFIG_FLOW_ENABLED:-false}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - michel_secrets:/run/michel-secrets:ro
      - resident_media:/var/lib/elise/media
      - camera_media:/var/lib/elise/camera-media
      - /run/elise-screen:/run/elise-screen
      - ${ELISE_AGENT_RUN_DIR:-/run/elise-remote-access}:/run/elise-remote-access
      - ${ELISE_UPDATE_AGENT_RUN_DIR:-/run/elise-update}:/run/elise-update
    group_add:
      - ${ELISE_AGENT_GID:-995}
    command:
      [
        '/bin/sh',
        '-c',
        './node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma && node dist/main.js',
      ]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/system/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    <<: *node-common
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      target: worker
    image: michel-os/worker:${MICHEL_VERSION:-0.1.3}
    depends_on:
      api:
        condition: service_healthy
    environment:
      MICHEL_SECRETS_DIR: /run/michel-secrets
      POSTGRES_HOST: postgres
      POSTGRES_DB: michel
      POSTGRES_USER: michel
      AI_BASE_URL: http://ai:8000
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      CAMERA_MEDIA_ROOT: /var/lib/elise/camera-media
      GO2RTC_URL: http://go2rtc:1984
      TOPOLOGY_TRACKING_ENABLED: ${TOPOLOGY_TRACKING_ENABLED:-true}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - michel_secrets:/run/michel-secrets:ro
      - camera_media:/var/lib/elise/camera-media

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      target: dashboard
    image: michel-os/dashboard:${MICHEL_VERSION:-0.1.3}
    environment:
      ELISE_JITSI_URL: ${ELISE_JITSI_URL:-https://jitsi.invalid}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${MICHEL_HTTP_PORT:-8080}:8080'
      - '127.0.0.1:${MICHEL_TAILSCALE_PROXY_PORT:-18080}:8081'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8080/']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  michel_secrets:
  go2rtc_config:
  postgres_data:
  mosquitto_data:
  resident_media:
  camera_media:
  zigbee2mqtt_data:
  homeassistant_data:
  ai_models:
