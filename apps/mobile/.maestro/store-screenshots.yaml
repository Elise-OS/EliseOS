# App Store screenshots in demo mode: only fictional data from src/demo/mock-api.ts.
# Run through scripts/store-screenshots.sh, which prepares the simulator status bar,
# picks the language (STORE_LANG=fr|en), the device family (DEVICE=iphone|ipad) and the
# output directory. File names stay the same in every language so fastlane pairs them.
appId: org.michel.mobile
# No env defaults here: Maestro lets them override the values given with -e.
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      true: ${STORE_LANG == 'en'}
    commands:
      - extendedWaitUntil:
          visible: 'English'
          timeout: 30000
      # Retried because a tap while the app is still starting can be lost.
      - repeat:
          while:
            notVisible: 'Explore the demo'
          times: 4
          commands:
            - tapOn: 'English'
            - waitForAnimationToEnd
- runScript:
    file: store-labels.js
- extendedWaitUntil:
    visible: ${output.labels.demo}
    timeout: 30000
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${DEVICE == 'iphone'}
    commands:
      - takeScreenshot: ${OUT}/01-${output.labels.welcomeFile}
# A tap during the welcome animation can be lost (seen on iPad): retry while the button stays.
- repeat:
    while:
      visible: ${output.labels.demo}
    times: 4
    commands:
      - tapOn: ${output.labels.demo}
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.labels.home}
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${output.labels.n.dashboard}-${output.labels.dashboardFile}
- tapOn: ${output.labels.alerts}
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${output.labels.n.alerts}-${output.labels.alertsFile}
- tapOn: ${output.labels.house}
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${output.labels.n.house}-${output.labels.houseFile}
- runFlow:
    when:
      true: ${DEVICE == 'iphone'}
    commands:
      - tapOn: ${output.labels.room}
      - waitForAnimationToEnd
      - takeScreenshot: ${OUT}/05-${output.labels.roomFile}
- tapOn: ${output.labels.journal}
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${output.labels.n.journal}-${output.labels.journalFile}
- tapOn: ${output.labels.screen}
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/${output.labels.n.screen}-${output.labels.screenFile}
