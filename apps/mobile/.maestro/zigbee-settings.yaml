# Captures the native Zigbee-key settings demo on the dedicated iPhone simulator.
# maestro test -e OUT=zigbee -e STORE_LANG=fr -e DEVICE=iphone .maestro/zigbee-settings.yaml
appId: org.michel.mobile
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      true: ${STORE_LANG == 'en'}
    commands:
      - extendedWaitUntil:
          visible:
            id: 'language-menu'
          timeout: 30000
      - repeat:
          while:
            notVisible: 'Explore the demo'
          times: 4
          commands:
            - tapOn:
                id: 'language-menu'
            - tapOn: 'English'
            - waitForAnimationToEnd
- runScript:
    file: store-labels.js
- runScript:
    file: zigbee-labels.js
- extendedWaitUntil:
    visible: ${output.labels.demo}
    timeout: 30000
- repeat:
    while:
      visible: ${output.labels.demo}
    times: 4
    commands:
      - tapOn: ${output.labels.demo}
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.labels.home}
    timeout: 30000
- tapOn: ${output.zigbee.settings}
- extendedWaitUntil:
    visible: ${output.zigbee.zigbee}
    timeout: 10000
- tapOn: ${output.zigbee.zigbee}
- extendedWaitUntil:
    visible: ${output.zigbee.healthy}
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/mobile-${STORE_LANG}-cle-saine
- tapOn: ${output.zigbee.search}
- scrollUntilVisible:
    element: ${output.zigbee.identify}
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/mobile-${STORE_LANG}-nouvelle-cle
- scrollUntilVisible:
    element: ${output.zigbee.network}
    direction: DOWN
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/mobile-${STORE_LANG}-cle-reseau
- scrollUntilVisible:
    element: ${output.zigbee.identify}
    direction: UP
- tapOn: ${output.zigbee.identify}
- extendedWaitUntil:
    visible: ${output.zigbee.useInstead}
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/mobile-${STORE_LANG}-identification
- tapOn: ${output.zigbee.useInstead}
- extendedWaitUntil:
    visible: ${output.zigbee.confirm}
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/mobile-${STORE_LANG}-confirmation
- scrollUntilVisible:
    element: ${output.zigbee.install}
    direction: DOWN
- tapOn: ${output.zigbee.install}
- scrollUntilVisible:
    element: ${output.zigbee.installing}
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/mobile-${STORE_LANG}-installation
- extendedWaitUntil:
    visible: ${output.zigbee.success}
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/mobile-${STORE_LANG}-succes
