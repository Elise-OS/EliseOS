preserve_hostname: false
disable_root: true
# The image has no shared password. Imager's singular `user:` entry is merged
# over this default and can deliberately unlock its own password when supplied.
ssh_pwauth: false
system_info:
  default_user:
    name: ubuntu
    lock_passwd: true
growpart:
  mode: auto
  devices: ['/']
  ignore_growroot_disabled: false
resize_rootfs: true
