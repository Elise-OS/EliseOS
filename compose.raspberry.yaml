services:
  mdns:
    build:
      context: .
      dockerfile: docker/mdns/Dockerfile
    image: elise-os/mdns:${ELISE_VERSION:-0.1.28}
    restart: unless-stopped
    network_mode: host
    depends_on:
      dashboard:
        condition: service_healthy
    environment:
      ELISE_DISCOVERY_NAME: ${ELISE_DISCOVERY_NAME:-Élise OS}
      ELISE_DISCOVERY_HOST: ${ELISE_DISCOVERY_HOST:-}
      ELISE_DISCOVERY_PORT: ${ELISE_HTTP_PORT:-8080}
      ELISE_DISCOVERY_URL: http://127.0.0.1:${ELISE_HTTP_PORT:-8080}/api/v1/discovery

  # On a Raspberry Pi 4 each health check starts a new process (node, python, mosquitto_sub…)
  # that costs about a second of CPU: every 5-10 s they steal CPU from video calls. Check
  # every 5 s while a service starts, then once a minute.
  postgres:
    healthcheck: &pi_healthcheck
      interval: 60s
      start_period: 120s
      start_interval: 5s
  mosquitto:
    healthcheck: *pi_healthcheck
  go2rtc:
    healthcheck: *pi_healthcheck
  ai:
    healthcheck: *pi_healthcheck
    # Background work yields to the TV and Jitsi when the CPU is busy (default weight 1024).
    cpu_shares: 256
  api:
    healthcheck: *pi_healthcheck
  dashboard:
    healthcheck: *pi_healthcheck
  worker:
    cpu_shares: 256
  homeassistant:
    cpu_shares: 256
