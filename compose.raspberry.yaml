services:
  mdns:
    build:
      context: .
      dockerfile: docker/mdns/Dockerfile
    image: elise-os/mdns:${ELISE_VERSION:-0.1.14}
    restart: unless-stopped
    network_mode: host
    depends_on:
      dashboard:
        condition: service_healthy
    environment:
      ELISE_DISCOVERY_NAME: ${ELISE_DISCOVERY_NAME:-Élise OS}
      ELISE_DISCOVERY_HOST: ${ELISE_DISCOVERY_HOST:-}
      ELISE_DISCOVERY_PORT: ${ELISE_HTTP_PORT:-8080}
      ELISE_DISCOVERY_URL: http://127.0.0.1:${ELISE_HTTP_PORT:-8080}/api/v1/discovery
