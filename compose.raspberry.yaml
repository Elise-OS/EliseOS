services:
  mdns:
    build:
      context: .
      dockerfile: docker/mdns/Dockerfile
    image: michel-os/mdns:${MICHEL_VERSION:-0.1.8}
    restart: unless-stopped
    network_mode: host
    depends_on:
      dashboard:
        condition: service_healthy
    environment:
      MICHEL_DISCOVERY_NAME: ${MICHEL_DISCOVERY_NAME:-Élise OS}
      MICHEL_DISCOVERY_HOST: ${MICHEL_DISCOVERY_HOST:-}
      MICHEL_DISCOVERY_PORT: ${MICHEL_HTTP_PORT:-8080}
      MICHEL_DISCOVERY_URL: http://127.0.0.1:${MICHEL_HTTP_PORT:-8080}/api/v1/discovery
